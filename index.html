<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Base Builder</title>
  <script>
  // iOS PWA не грузит WebGL-карты. Редирект в Safari.
  if (window.navigator.standalone === true) {
    window.location.href = 'https://mvngrd.github.io/builder/?from=pwa';
  }
</script>
  <link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#22c55e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="hud">
    <div class="hud-row">
      <span>📍 <span id="distance">0</span> м</span>
      <span>💰 <span id="score">0</span></span>
    </div>
    <div class="hud-row inventory">
      <span>🪵 <span id="inv-wood">0</span></span>
      <span>⚙️ <span id="inv-metal">0</span></span>
      <span>🔌 <span id="inv-chip">0</span></span>
      <span>⛽ <span id="inv-fuel">0</span></span>
    </div>
    <div id="status">Определяем позицию…</div>
  </div>

  <div id="map"></div>

<div id="actions">
  <button id="baseBtn">🏠 База</button>
</div>
  
  <div id="baseModal" class="modal hidden">
    <div class="modal-content">
      <h2>🏠 База</h2>
      <div id="buildings"></div>
      <button id="closeBase">Закрыть</button>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="game.js"></script>
  <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error', err));
}
</script>
</body>
</html>
